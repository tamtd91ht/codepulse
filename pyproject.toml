[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codepulse"
version = "0.1.0"
description = "GitLab collector + AI code review with severity scoring per member"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "rq>=2.0,<3",  # 3.x changed the worker API; upgrade deliberately, with tests
    "apscheduler>=3.10,<4",
    "httpx>=0.28",
    "cryptography>=44",
    "pyjwt>=2.9",
    "jinja2>=3.1",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
    "respx>=0.22",
]

[project.scripts]
codepulse = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.reporting" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored Claude Code skills (their own style and tests), not CodePulse code.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Report titles use the en dash of docs/specs/10 on purpose.
"app/reporting/report.py" = ["RUF001"]
"tests/api/test_reports.py" = ["RUF001", "S101"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["rq.*", "apscheduler.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs Docker (testcontainers)"]
