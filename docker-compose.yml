services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: codepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codepulse}
      POSTGRES_DB: codepulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepulse -d codepulse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      retries: 5
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: ["python", "-m", "app.workers"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      start_period: 20s
      retries: 3
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Next.js dashboard; it proxies /api to the api service, so set APP_BASE_URL to its URL.
  web:
    build:
      context: ./dashboards/web
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
