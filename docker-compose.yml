services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: codepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codepulse}
      POSTGRES_DB: codepulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepulse -d codepulse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    # docs/specs/13: migrations run when the api starts (only this service migrates).
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - command-runs:/tmp/codepulse-runs  # shared with command-worker (app/commands)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      retries: 5
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: ["python", "-m", "app.workers"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      start_period: 20s
      retries: 3
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Runs .claude commands from Admin > Chay command (queue "commands", app/commands).
  command-worker:
    build: .
    image: codepulse-app:latest  # also the image of each command's container
    command: ["python", "-m", "app.workers", "commands"]
    volumes:
      - command-runs:/tmp/codepulse-runs
      - command-gate:/run/codepulse-gate
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # The only holder of the Docker socket, for command-worker (app/commands/gate.py).
  command-gate:
    build: .
    image: codepulse-app:latest
    user: root
    network_mode: none
    command: ["python", "-m", "app.commands.gate"]
    environment:
      COMMAND_IMAGE: codepulse-app:latest
      COMMAND_NETWORK: codepulse-commands
      # A laptop rarely has XFS quotas or the RUNBOOK §15 firewall; never set these in prod.
      COMMAND_ALLOW_NO_DISK_QUOTA: "1"
      COMMAND_ALLOW_OPEN_NETWORK: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - command-gate:/run/codepulse-gate

  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Next.js dashboard; it proxies /api to the api service, so set APP_BASE_URL to its URL.
  web:
    build:
      context: ./dashboards/web
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # docs/specs/13: daily pg_dump, 14 days kept in ./backups (copy them off the host too).
  backup:
    image: postgres:16
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: codepulse
      PGPASSWORD: ${POSTGRES_PASSWORD:-codepulse}
      PGDATABASE: codepulse
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  command-runs:
  command-gate:
