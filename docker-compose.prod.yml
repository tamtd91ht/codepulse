# Production stack for a single VPS (docs/specs/13, docs/RUNBOOK.md).
# Layout: repo cloned to /opt/codepulse/app, dumps in /opt/codepulse/backups.
#   cd /opt/codepulse/app && docker compose --env-file .env.local -f docker-compose.prod.yml up -d --build
# Config comes from .env.local (gitignored). PostgreSQL and Redis are standalone servers on the
# network, reached through DATABASE_URL and REDIS_URL.
#
# Every service uses the host's network stack: host firewalls (firewalld, ufw) commonly reject
# traffic from Docker bridges to the host's own IP ("No route to host"), which is where the
# standalone PostgreSQL/Redis listen. Ports are therefore bound by the processes themselves:
# the api on 127.0.0.1:8000 only, the dashboard on WEB_HOST:WEB_PORT. The dashboard proxies /api,
# so GitLab webhooks and OAuth go through it too.

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

x-app: &app
  build: .
  image: codepulse-app:latest
  pull_policy: build  # local image: never try Docker Hub
  restart: unless-stopped
  logging: *logging
  network_mode: host
  env_file: [.env.local]

# Command runs (Admin > Chạy command, app/commands): the command worker writes the files, the
# api sends them; both mount the same folder at COMMAND_RUNS_DIR.
x-runs: &runs
  - command-runs:/tmp/codepulse-runs

services:
  api:
    <<: *app
    # Logs whether PostgreSQL/Redis are reachable, then migrates (only this service migrates).
    # Bound to localhost: only the dashboard (same host) and a local Prometheus call it.
    command: ["sh", "-c", "python -m app.startup_check; alembic upgrade head && uvicorn app.api.main:app --host 127.0.0.1 --port 8000 --proxy-headers"]
    environment:
      # Only local processes reach the api, so trust X-Forwarded-For from the dashboard proxy;
      # WEBHOOK_ALLOWED_IPS then sees GitLab's address, not the proxy's.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      start_period: 60s  # first start runs every migration
      retries: 5
    volumes: *runs

  worker:
    <<: *app
    command: ["python", "-m", "app.workers"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      start_period: 20s
      retries: 3

  # Runs .claude commands (queue "commands") apart from reviews: one command may take
  # COMMAND_TIMEOUT_MIN. Scale it for more commands at once (still one per repo at a time).
  command-worker:
    <<: *app
    command: ["python", "-m", "app.workers", "commands"]
    volumes:
      - command-runs:/tmp/codepulse-runs
      - command-gate:/run/codepulse-gate
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      start_period: 20s
      retries: 3

  # The only holder of the Docker socket (app/commands/gate.py): it creates each command's
  # throwaway container from a config of its own, and only touches the containers it labelled.
  # No network at all: the command worker reaches it through a unix socket on the
  # `command-gate` volume, which no other service mounts. Runs as root to use docker.sock.
  command-gate:
    image: codepulse-app:latest
    pull_policy: build
    build: .
    restart: unless-stopped
    logging: *logging
    user: root
    network_mode: none
    command: ["python", "-m", "app.commands.gate"]
    environment:
      COMMAND_IMAGE: codepulse-app:latest
      COMMAND_NETWORK: codepulse-commands
      COMMAND_MEMORY_MB: ${COMMAND_MEMORY_MB:-4096}
      COMMAND_CPUS: ${COMMAND_CPUS:-2}
      COMMAND_DISK_MB: ${COMMAND_DISK_MB:-5120}
      # Off by default: the gate refuses runs without a disk quota or with the host reachable
      # from the command network (docs/RUNBOOK.md §15).
      COMMAND_ALLOW_NO_DISK_QUOTA: ${COMMAND_ALLOW_NO_DISK_QUOTA:-0}
      COMMAND_ALLOW_OPEN_NETWORK: ${COMMAND_ALLOW_OPEN_NETWORK:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - command-gate:/run/codepulse-gate

  scheduler:
    <<: *app
    command: ["python", "-m", "app.scheduler"]

  web:
    build:
      context: ./dashboards/web
      args:
        API_URL: http://127.0.0.1:8000
    image: codepulse-web:latest
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    network_mode: host
    environment:
      # Address to listen on: the host's LAN IP, or 0.0.0.0 for every interface.
      HOSTNAME: ${WEB_HOST:-0.0.0.0}
      PORT: ${WEB_PORT:-3000}
    depends_on:
      api: {condition: service_healthy}

  # Daily pg_dump of DATABASE_URL, BACKUP_KEEP_DAYS kept; copy /opt/codepulse/backups off the host too.
  # pg_dump must be at least the server's major version (the standalone server runs 17).
  backup:
    image: postgres:${BACKUP_PG_VERSION:-17}
    restart: unless-stopped
    logging: *logging
    network_mode: host
    entrypoint: ["sh", "/backup.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.local and pass --env-file .env.local}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ${CODEPULSE_BACKUPS:-/opt/codepulse/backups}:/backups

volumes:
  command-runs:
  command-gate:
