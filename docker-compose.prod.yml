# Production stack for a single VPS (docs/specs/13, docs/RUNBOOK.md).
# Layout: repo cloned to /opt/codepulse/app, data in /opt/codepulse/data, dumps in /opt/codepulse/backups.
#   cd /opt/codepulse/app && docker compose -f docker-compose.prod.yml up -d --build
# Only the dashboard (web) is published; it proxies /api, so GitLab webhooks and OAuth go through it too.

x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

x-app: &app
  build: .
  image: codepulse-app:latest
  restart: unless-stopped
  logging: *logging
  env_file: [.env]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: codepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: codepulse
    volumes:
      - ${CODEPULSE_DATA:-/opt/codepulse/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepulse -d codepulse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    # AOF keeps queued review jobs across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${CODEPULSE_DATA:-/opt/codepulse/data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    # Migrations run when the api starts (only this service migrates).
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    environment:
      # The api is only reachable from the compose network and localhost, so trust X-Forwarded-For
      # from the web proxy; WEBHOOK_ALLOWED_IPS then sees GitLab's address, not the web container's.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      # Localhost only: for a Prometheus scrape on this host. Never publish it publicly.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      retries: 5

  worker:
    <<: *app
    command: ["python", "-m", "app.workers"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      start_period: 20s
      retries: 3

  scheduler:
    <<: *app
    command: ["python", "-m", "app.scheduler"]

  web:
    build:
      context: ./dashboards/web
      args:
        API_URL: http://api:8000
    image: codepulse-web:latest
    restart: unless-stopped
    logging: *logging
    ports:
      # Plain HTTP on the LAN. If the host also has a public interface, set WEB_BIND=<lan-ip>:3000
      # so the dashboard listens on the internal address only.
      - "${WEB_BIND:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}

  # Daily pg_dump, BACKUP_KEEP_DAYS kept; copy /opt/codepulse/backups off the host too.
  backup:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: codepulse
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: codepulse
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ${CODEPULSE_BACKUPS:-/opt/codepulse/backups}:/backups
    depends_on:
      postgres: {condition: service_healthy}
