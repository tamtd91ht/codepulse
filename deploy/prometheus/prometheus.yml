# Example scrape config; set the bearer token to METRICS_TOKEN.
global:
  scrape_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: codepulse
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/codepulse_token
    static_configs:
      - targets: ["api:8000"]
